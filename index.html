<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DevisFacile</title>

<style>

* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  padding: 30px 15px;
  background: #f3f4f6;
  color: #111827;
}

.container {
  max-width: 950px;
  margin: auto;
}

h1 {
  text-align: center;
  margin-bottom: 5px;
}

.subtitle {
  text-align: center;
  color: #6b7280;
  margin-bottom: 30px;
}

.card {
  background: white;
  padding: 25px;
  margin-bottom: 20px;
  border-radius: 15px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.07);
}

h2 {
  margin-top: 0;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
}

.full {
  grid-column: 1 / -1;
}

label {
  display: block;
  font-weight: bold;
  margin-bottom: 6px;
}

input,
textarea,
select {
  width: 100%;
  padding: 12px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  font-size: 15px;
}

textarea {
  min-height: 80px;
}

button {
  width: 100%;
  margin-top: 15px;
  padding: 14px;
  border: none;
  border-radius: 8px;
  background: #2563eb;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #1d4ed8;
}

.btn-secondary {
  background: #10b981;
}

.btn-secondary:hover {
  background: #059669;
}

.prestation {
  border: 1px solid #e5e7eb;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 15px;
}

.prestation-grid {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr;
  gap: 10px;
  align-items: end;
}

.remove {
  background: #ef4444;
  margin-top: 10px;
}

.remove:hover {
  background: #dc2626;
}

#devis {
  display: none;
  background: white;
  padding: 45px;
  margin-top: 30px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.07);
}

.devis-top {
  display: flex;
  justify-content: space-between;
  gap: 30px;
  margin-bottom: 40px;
}

.devis-title {
  font-size: 34px;
  font-weight: bold;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 30px;
}

th,
td {
  padding: 12px;
  border-bottom: 1px solid #ddd;
  text-align: left;
}

th {
  background: #f3f4f6;
}

.resume {
  margin-top: 25px;
  margin-left: auto;
  max-width: 300px;
}

.resume div {
  display: flex;
  justify-content: space-between;
  padding: 7px 0;
}

.resume .grand-total {
  border-top: 2px solid #111827;
  margin-top: 8px;
  padding-top: 12px;
  font-size: 20px;
  font-weight: bold;
}

.actions {
  margin-top: 30px;
}

@media (max-width: 700px) {

  body {
    padding: 15px;
  }

  .grid,
  .prestation-grid {
    grid-template-columns: 1fr;
  }

  .full {
    grid-column: auto;
  }

  #devis {
    padding: 25px;
  }

  .devis-top {
    display: block;
  }
}

@media print {

  body {
    background: white;
    padding: 0;
  }

  .container > *:not(#devis) {
    display: none !important;
  }

  #devis {
    display: block !important;
    margin: 0;
    padding: 20px;
    box-shadow: none;
  }

  .actions {
    display: none !important;
  }
}

</style>
</head>

<body>

<div class="container">

<h1>DevisFacile</h1>

<p class="subtitle">
Créez votre devis professionnel en quelques secondes.
</p>


<!-- INFORMATIONS ENTREPRISE -->

<div class="card">

<h2>Vos informations</h2>

<div class="grid">

<div>
<label>Nom / Entreprise</label>
<input id="entreprise" placeholder="Jean Dupont">
</div>

<div>
<label>SIRET</label>
<input id="siret" placeholder="12345678900000">
</div>

<div>
<label>Email</label>
<input id="email" placeholder="vous@email.com">
</div>

<div>
<label>Téléphone</label>
<input id="telephone" placeholder="06 00 00 00 00">
</div>

<div class="full">
<label>Adresse</label>
<input id="adresse" placeholder="1 rue de Paris, 75000 Paris">
</div>

</div>

</div>


<!-- CLIENT -->

<div class="card">

<h2>Client</h2>

<div class="grid">

<div>
<label>Nom / Entreprise</label>
<input id="client" placeholder="Entreprise cliente">
</div>

<div>
<label>Email</label>
<input id="clientEmail" placeholder="client@email.com">
</div>

</div>

</div>


<!-- PRESTATIONS -->

<div class="card">

<h2>Prestations</h2>

<div id="prestations"></div>

<button
type="button"
class="btn-secondary"
onclick="ajouterPrestation()">

+ Ajouter une prestation

</button>

</div>


<!-- TVA -->

<div class="card">

<h2>Taxes</h2>

<label>TVA</label>

<select id="tva">

<option value="0">0 %</option>
<option value="5.5">5,5 %</option>
<option value="10">10 %</option>
<option value="20" selected>20 %</option>

</select>

<button onclick="genererDevis()">

Générer mon devis

</button>

</div>


<!-- DEVIS -->

<div id="devis">

<div class="devis-top">

<div>

<div class="devis-title">
DEVIS
</div>

<p id="numeroDevis"></p>

<p id="dateDevis"></p>

</div>


<div>

<strong id="devisEntreprise"></strong>

<p id="devisAdresse"></p>

<p id="devisEmail"></p>

<p id="devisTelephone"></p>

<p id="devisSiret"></p>

</div>

</div>


<h3>Client</h3>

<p id="devisClient"></p>

<p id="devisClientEmail"></p>


<table>

<thead>

<tr>

<th>Description</th>

<th>Quantité</th>

<th>Prix unitaire</th>

<th>Total HT</th>

</tr>

</thead>

<tbody id="tableauPrestations">

</tbody>

</table>


<div class="resume">

<div>

<span>Total HT</span>

<strong id="totalHT"></strong>

</div>

<div>

<span>TVA</span>

<strong id="montantTVA"></strong>

</div>

<div class="grand-total">

<span>Total TTC</span>

<strong id="totalTTC"></strong>

</div>

</div>


<div class="actions">

<button onclick="window.print()">

Télécharger / enregistrer en PDF

</button>

</div>

</div>

</div>


<script>

let compteur = 0;


/* AJOUTER UNE PRESTATION */

function ajouterPrestation() {

  compteur++;

  const div = document.createElement("div");

  div.className = "prestation";

  div.id = "prestation-" + compteur;

  div.innerHTML = `

    <div class="prestation-grid">

      <div>

        <label>Description</label>

        <input
          class="description"
          placeholder="Création d'un site internet">

      </div>

      <div>

        <label>Quantité</label>

        <input
          class="quantite"
          type="number"
          min="1"
          value="1">

      </div>

      <div>

        <label>Prix unitaire HT (€)</label>

        <input
          class="prix"
          type="number"
          min="0"
          step="0.01"
          placeholder="500">

      </div>

    </div>

    <button
      type="button"
      class="remove"
      onclick="supprimerPrestation(${compteur})">

      Supprimer

    </button>

  `;

  document
    .getElementById("prestations")
    .appendChild(div);

}


/* SUPPRIMER */

function supprimerPrestation(id) {

  const element =
    document.getElementById("prestation-" + id);

  if (element) {
    element.remove();
  }

}


/* FORMAT EURO */

function euro(nombre) {

  return nombre.toLocaleString("fr-FR", {
    style: "currency",
    currency: "EUR"
  });

}


/* GENERER DEVIS */

function genererDevis() {

  const entreprise =
    document.getElementById("entreprise").value;

  const siret =
    document.getElementById("siret").value;

  const email =
    document.getElementById("email").value;

  const telephone =
    document.getElementById("telephone").value;

  const adresse =
    document.getElementById("adresse").value;

  const client =
    document.getElementById("client").value;

  const clientEmail =
    document.getElementById("clientEmail").value;

  const tva =
    parseFloat(
      document.getElementById("tva").value
    ) || 0;


  const prestations =
    document.querySelectorAll(".prestation");


  if (prestations.length === 0) {

    alert(
      "Ajoutez au moins une prestation."
    );

    return;
  }


  let totalHT = 0;

  let lignes = "";


  prestations.forEach(function(prestation) {

    const description =
      prestation.querySelector(".description").value;

    const quantite =
      parseFloat(
        prestation.querySelector(".quantite").value
      ) || 0;

    const prix =
      parseFloat(
        prestation.querySelector(".prix").value
      ) || 0;

    const total =
      quantite * prix;

    totalHT += total;


    lignes += `

      <tr>

        <td>${description}</td>

        <td>${quantite}</td>

        <td>${euro(prix)}</td>

        <td>${euro(total)}</td>

      </tr>

    `;

  });


  const montantTVA =
    totalHT * tva / 100;

  const totalTTC =
    totalHT + montantTVA;


  /* INFORMATIONS */

  document.getElementById(
    "devisEntreprise"
  ).textContent = entreprise;


  document.getElementById(
    "devisAdresse"
  ).textContent = adresse;


  document.getElementById(
    "devisEmail"
  ).textContent = email;


  document.getElementById(
    "devisTelephone"
  ).textContent = telephone;


  document.getElementById(
    "devisSiret"
  ).textContent =
    "SIRET : " + siret;


  document.getElementById(
    "devisClient"
  ).textContent = client;


  document.getElementById(
    "devisClientEmail"
  ).textContent = clientEmail;


  /* NUMERO */

  const numero =
    "DEV-" +
    new Date().getTime().toString().slice(-6);


  document.getElementById(
    "numeroDevis"
  ).textContent =
    "N° " + numero;


  /* DATE */

  document.getElementById(
    "dateDevis"
  ).textContent =
    "Date : " +
    new Date().toLocaleDateString("fr-FR");


  /* TABLE */

  document.getElementById(
    "tableauPrestations"
  ).innerHTML = lignes;


  /* TOTAUX */

  document.getElementById(
    "totalHT"
  ).textContent = euro(totalHT);


  document.getElementById(
    "montantTVA"
  ).textContent =
    euro(montantTVA) +
    " (" + tva + " %)";


  document.getElementById(
    "totalTTC"
  ).textContent = euro(totalTTC);


  /* AFFICHAGE */

  document.getElementById(
    "devis"
  ).style.display = "block";


  document.getElementById(
    "devis"
  ).scrollIntoView({
    behavior: "smooth"
  });

}


/* UNE PRESTATION PAR DEFAUT */

ajouterPrestation();

</script>

</body>
</html>
